name: Pull Request Check
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir registry install --frozen-lockfile
      - run: pnpm run check-pr-files
      - run: pnpm run type
      - run: pnpm exec tsc -p dev-tools/dev-server/tsconfig.json --noEmit
      - run: pnpm exec tsc -p webpack/tsconfig.json --noEmit
      - run: pnpm run lint-check
      - run: pnpm test
      - run: pnpm run build
