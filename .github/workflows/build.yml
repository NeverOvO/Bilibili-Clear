name: HomeFix Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir registry install --frozen-lockfile
      - run: pnpm run build-homefix
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili-evolved-homefix
          path: |
            dist/bilibili-evolved.user.js
            registry/dist/components/style/simplify/home.js*
            registry/dist/components/style/custom-navbar.js*
            registry/dist/components/utils/remove-promotions.js*
            registry/dist/components/style/hide/video/recommended-live.js*
